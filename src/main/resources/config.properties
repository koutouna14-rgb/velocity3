# Discord bot token (https://discord.com/developers/applications)
token=YOUR_BOT_TOKEN

# ID of the Discord channel to sync with (Developer Mode -> right click channel -> Copy ID)
channel-id=000000000000000000

# Webhook for the SAME channel (Channel settings -> Integrations -> Webhooks -> New Webhook -> Copy URL).
# With a webhook, in-game chat appears in Discord as the player's name + skin head.
# Leave empty to use bot embeds instead.
webhook-url=

# Player head image. {uuid} and {name} are replaced automatically.
# Works for online-mode (premium) accounts. Other options:
#   https://minotar.net/helm/{name}/128
#   https://crafatar.com/avatars/{uuid}?overlay
avatar-url=https://mc-heads.net/avatar/{uuid}/128

# Show chat from one server to players on the other servers (lobby <-> smp)
relay-between-servers=true

# Post join / leave / server-switch cards
announce-join-leave=true

# Display names for your servers. Key = server name in velocity.toml
server.lobby=Lobby
server.smp=SMP

# Server name (from velocity.toml) that /hub, /lobby and /l send players to
lobby-server=lobby
